<!DOCTYPE html>
<title>Road to Legend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 바 + 탭. '커리어' 탭은 왼쪽 선수 카드·선택 패널 / 오른쪽 나이별 커리어 표(Copero식), 나머지 탭은 FotMob식 단일 열 프로필 */
:root {
  color-scheme: dark;
  --bg: #0b0d11;
  --panel: #13161c;
  --panel2: #1a1e26;
  --panel3: #232833;
  --line: #2a303b;
  --fg: #eef1f5;
  --mute: #8b94a3;
  --dim: #5d6573;
  --gold: #f2c14e;
  --gold2: #b8862b;
  --good: #2fbf71;
  --bad: #e5484d;
  --warn: #f08c2e;
  --blue: #2f8cf0;
  --pitch: #0f3d2b;
  --pitch2: #124733;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'IBM Plex Sans KR', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 14px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input, select { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.tab-nums { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.dim { color: var(--dim); }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
#app { min-height: 100%; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; white-space: nowrap; }
.brand .mk { width: 26px; height: 26px; border-radius: 7px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 15px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 7px 11px; border-radius: 8px; color: var(--mute); font-weight: 600; white-space: nowrap; position: relative; transition: color .15s, background .15s; }
.tabs button:hover { color: var(--fg); }
.tabs button.on { color: var(--fg); background: var(--panel2); }
.tabs button .dot { position: absolute; top: 5px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.topinfo { display: flex; gap: 14px; align-items: center; color: var(--mute); font-size: 12px; white-space: nowrap; }
.topinfo b { color: var(--fg); font-family: var(--font-display); font-size: 16px; }
@media (max-width: 760px) { .topinfo .hide-s { display: none; } .top .wrap { gap: 10px; } .brand span.t { display: none; } }

/* 공통 패널 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.ph { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pb { padding: 16px 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 999px; font-weight: 700; background: var(--fg); color: var(--bg); transition: transform .12s, filter .15s, opacity .15s; }
.btn:hover { filter: brightness(.92); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--panel2); }
.btn.gold { background: var(--gold); color: #1d1503; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel3); color: var(--fg); white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: #7ee2a8; }
.chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: #ff9a9d; }
.chip.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.chip.blue { background: color-mix(in srgb, var(--blue) 18%, transparent); color: #8cc1ff; }
.rt { display: inline-grid; place-items: center; min-width: 38px; height: 22px; padding: 0 6px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #fff; }
.rt.r9 { background: var(--blue); } .rt.r8 { background: var(--blue); } .rt.r7 { background: var(--good); } .rt.r6 { background: var(--warn); } .rt.r5 { background: var(--bad); } .rt.r0 { background: var(--panel3); color: var(--mute); }

/* 화면 전환 */
.screen { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) both; }
.screen.still, .screen.still * { animation: none !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 0%, transparent); } 50% { box-shadow: 0 0 34px 6px color-mix(in srgb, var(--gold) 45%, transparent); } }
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-28px); } }
@keyframes shine { from { transform: translateX(-120%) skewX(-18deg); } to { transform: translateX(260%) skewX(-18deg); } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* 홈 */
.home { padding-block: 48px 64px; display: grid; gap: 28px; }
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-size: clamp(44px, 7vw, 86px); line-height: .92; font-weight: 800; letter-spacing: -.005em; text-transform: uppercase; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero p { color: var(--mute); max-width: 52ch; font-size: 15px; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.feat .f { padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.feat .f b { display: block; margin-bottom: 4px; }
.feat .f span { color: var(--mute); font-size: 13px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* 생성 화면 */
.create { padding-block: 24px 40px; }
.cgrid { display: grid; grid-template-columns: 300px 1fr 300px; gap: 0; }
.cgrid > section { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cgrid > section + section { border-left: 1px solid var(--line); }
.cgrid h3 { text-align: center; font-size: 16px; }
@media (max-width: 980px) { .cgrid { grid-template-columns: 1fr; } .cgrid > section + section { border-left: 0; border-top: 1px solid var(--line); } }
.jersey { display: grid; place-items: center; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel2); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { padding: 7px; border-radius: 7px; color: var(--mute); font-weight: 600; }
.seg button.on { background: var(--fg); color: var(--bg); }
.natlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; padding: 6px; background: var(--panel2); border-radius: 12px; }
.natlist button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; text-align: left; font-weight: 600; font-size: 13px; border: 1px solid transparent; }
.natlist button:hover { background: var(--panel3); }
.natlist button.on { border-color: var(--fg); background: var(--panel3); }
.flag { width: 26px; height: 18px; border-radius: 3px; flex: none; overflow: hidden; display: inline-block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.pitchpick { position: relative; aspect-ratio: 68/90; max-width: 100%; border-radius: 10px; background: repeating-linear-gradient(0deg, var(--pitch) 0 10%, var(--pitch2) 10% 20%); border: 2px solid rgba(255,255,255,.6); overflow: hidden; }
.pitchpick .pb { position: absolute; transform: translate(-50%, -50%); padding: 6px 10px; border-radius: 999px; background: #0c2b1f; color: #d9f2e5; font-weight: 700; font-size: 12px; border: 1px solid rgba(255,255,255,.12); font-family: var(--font-display); letter-spacing: .04em; transition: transform .15s, background .15s; }
.pitchpick .pb:hover { transform: translate(-50%, -50%) scale(1.08); }
.pitchpick .pb.on { background: #fff; color: #0b0d11; }
.styles { display: grid; gap: 6px; }
.styles button { text-align: left; padding: 9px 12px; border-radius: 10px; background: var(--panel2); border: 1px solid transparent; }
.styles button.on { border-color: var(--fg); }
.styles button b { display: block; font-size: 13px; }
.styles button span { font-size: 12px; color: var(--mute); }
.cfoot { display: flex; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--line); gap: 10px; }
.diffsec { display: grid; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); }
.diffpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.diffpick button { display: grid; gap: 4px; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; font: inherit; }
.diffpick button b { font-size: 15px; }
.diffpick button .pr { font-size: 12px; color: var(--fg); }
.diffpick button .mute { font-size: 11px; }
.diffpick button.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
@media (max-width: 760px) { .diffpick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.realgrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.realgrid > section { padding: 16px 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.realgrid > section + section { border-left: 1px solid var(--line); }
@media (max-width: 860px) { .realgrid { grid-template-columns: 1fr; } .realgrid > section + section { border-left: 0; border-top: 1px solid var(--line); } }
.reallist { display: grid; gap: 2px; max-height: 420px; overflow-y: auto; }
.reallist button { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 44px minmax(0, 120px) 40px; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; border: 0; background: transparent; color: var(--fg); text-align: left; cursor: pointer; font: inherit; font-size: 13px; }
.reallist button:hover { background: var(--panel2); }
.reallist button.on { background: var(--panel3); box-shadow: inset 0 0 0 1px var(--gold); }
.reallist .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reallist .cl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
@media (max-width: 560px) { .reallist button { grid-template-columns: 22px minmax(0, 1fr) auto 40px; } .reallist .cl, .reallist button > .mute:not(.cl) { display: none; } }
.realpick { display: grid; gap: 6px; }

/* 아카데미 선택 */
.acad { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.acad button { text-align: left; padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 10px; transition: transform .15s, border-color .15s; }
.acad button:hover { transform: translateY(-3px); border-color: var(--mute); }

/* 허브 */
.hub { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 18px; padding-block: 20px 40px; align-items: start; }
@media (max-width: 1000px) { .hub { grid-template-columns: 1fr; } }
.card { padding: 18px; display: grid; gap: 16px; }
.idrow { display: grid; grid-template-columns: 92px 1fr; gap: 12px; }
.ovr { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; align-content: center; position: relative; overflow: hidden; background: linear-gradient(160deg, #7d8798, #4c5463); }
.ovr .l { font-size: 11px; font-weight: 700; letter-spacing: .1em; opacity: .85; }
.ovr .v { font-family: var(--font-display); font-weight: 800; font-size: 50px; line-height: .9; }
.ovr.g1 { background: linear-gradient(160deg, #8a6a3a, #5d4421); } .ovr.g2 { background: linear-gradient(160deg, #9aa5b5, #5f6979); } .ovr.g3 { background: linear-gradient(160deg, #e7c157, #a77a1f); color: #241803; } .ovr.g4 { background: linear-gradient(160deg, #3a4b8f, #151c3f); color: #e8d9ff; box-shadow: inset 0 0 0 2px #b79bff55; }
.ovr::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-120%) skewX(-18deg); }
.ovr.flash::after { animation: shine .9s ease-out; }
.ovr.flash { animation: glow 1.2s ease-out; }
.idbox { border-radius: 14px; background: var(--panel2); padding: 12px 14px; display: grid; gap: 6px; position: relative; overflow: hidden; }
.idbox .stripe { position: absolute; inset: 0 auto 0 0; width: 4px; }
.idbox .name { font-weight: 700; font-size: 18px; line-height: 1.2; display: flex; align-items: center; gap: 8px; }
.idbox .meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; text-align: center; }
.kv > div + div { border-left: 1px solid var(--line); }
.kv .v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.shelf { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; justify-content: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.shelf .tr { width: 26px; height: 30px; display: grid; place-items: center; animation: pop .5s both; }

/* 커리어 표 */
.ctable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 13px; }
.ctable th { white-space: nowrap; font-size: 10px; letter-spacing: .08em; color: var(--dim); font-weight: 600; text-align: left; padding: 0 8px; }
.ctable td { padding: 7px 8px; background: var(--panel2); }
.ctable td:first-child { border-radius: 8px 0 0 8px; } .ctable td:last-child { border-radius: 0 8px 8px 0; }
.ctable tr.empty td { background: transparent; color: var(--dim); }
.ctable tr.row { cursor: pointer; animation: rowIn .35s both; }
.ctable tr.row:hover td { background: var(--panel3); }
.ctable tr.cur td { background: color-mix(in srgb, var(--gold) 9%, var(--panel2)); }
.agebadge { display: inline-grid; place-items: center; width: 28px; height: 22px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #fff; }
.ovrb { display: inline-grid; place-items: center; min-width: 32px; height: 22px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #fff; }
.ovrb.o1 { background: #8a5a26; } .ovrb.o2 { background: #b8732a; } .ovrb.o3 { background: #7b8597; } .ovrb.o4 { background: #c49a2d; color: #1e1503; } .ovrb.o5 { background: #5a46b8; }
.tscroll { overflow-x: auto; }

/* 선택 패널 */
.act { display: grid; gap: 14px; }
.act h2 { font-size: 20px; }
.ev { display: grid; gap: 14px; animation: fadeUp .4s both; }
.ev .ico { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: var(--panel2); color: var(--gold); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opt { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; transition: transform .15s, border-color .15s, background .15s; }
.opt:hover { transform: translateY(-2px); border-color: var(--mute); }
.opt .t { font-weight: 700; font-size: 15px; }
.opt .d { color: var(--mute); font-size: 12px; margin-top: -6px; }
.outs { display: grid; gap: 6px; }
.out { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--panel3); }
.out.good { background: color-mix(in srgb, var(--good) 14%, var(--panel2)); color: #8ce6b3; }
.out.bad { background: color-mix(in srgb, var(--bad) 14%, var(--panel2)); color: #ffa3a6; }
.out .p { font-family: var(--font-display); font-size: 15px; padding: 1px 7px; border-radius: 6px; background: rgba(0,0,0,.25); }
.out.hit { outline: 2px solid currentColor; animation: pop .45s both; }
.out.miss { opacity: .35; }
.result { padding: 14px; border-radius: 12px; background: var(--panel2); display: grid; gap: 8px; animation: fadeUp .4s both; }
.chg { display: flex; flex-wrap: wrap; gap: 6px; }
.offer { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); animation: fadeUp .35s both; }
.offer .cn { font-weight: 700; }
.offer .terms { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mute); }
.offer .terms b { color: var(--fg); font-weight: 600; }
.offer .btns { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 520px) { .offer { grid-template-columns: 40px 1fr; } .offer .btns { grid-column: 1 / -1; flex-direction: row; } }
.focusgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.focusgrid .tg { font-size: 11px; color: var(--gold); margin-top: 3px; line-height: 1.35; }
.focusgrid button { text-align: left; padding: 11px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; display: grid; gap: 2px; }
.focusgrid button.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--panel2)); }
.focusgrid b { font-size: 13px; } .focusgrid span { font-size: 11px; color: var(--mute); }
.ticker { max-height: 330px; overflow-y: auto; display: grid; gap: 4px; padding-right: 4px; }
.tk { display: grid; grid-template-columns: 54px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--panel2); font-size: 12px; animation: rowIn .25s both; }
.tk .res { font-family: var(--font-display); font-weight: 700; font-size: 15px; min-width: 52px; text-align: center; border-radius: 6px; padding: 0 6px; }
.res.W { background: color-mix(in srgb, var(--good) 22%, transparent); color: #7ee2a8; } .res.D { background: var(--panel3); color: var(--fg); } .res.L { background: color-mix(in srgb, var(--bad) 22%, transparent); color: #ff9a9d; }
.prog { height: 6px; background: var(--panel3); border-radius: 99px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .2s; }
.statline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.statline > div { background: var(--panel2); border-radius: 10px; padding: 10px; text-align: center; }
.statline .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }

/* 오버레이 */
.ov { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,9,.82); backdrop-filter: blur(6px); display: flex; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadeIn .25s both; overflow-y: auto; }
.ovbox { margin: auto; width: min(720px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; animation: pop .4s both; }
.ovbox .head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.ovbox .body { padding: 18px 20px; display: grid; gap: 14px; }
.goalsvg { width: 100%; height: auto; display: block; cursor: crosshair; border-radius: 12px; background: linear-gradient(180deg, #0e1f2f, #10382a 70%); touch-action: manipulation; }
.banner { font-family: var(--font-display); font-weight: 800; font-size: 54px; text-align: center; letter-spacing: .04em; animation: pop .5s both; line-height: 1; }
